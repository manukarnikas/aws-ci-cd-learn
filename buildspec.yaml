version: 0.2

cache:
  paths:
    - '/root/.npm/**/*'

phases:
  install:
    commands:
      - echo "=== NPM CACHE ==="
      - npm config get cache
      - du -sh /root/.npm 2>/dev/null || true
      - find /root/.npm -type f | head -20
      - npm ci

  build:
    commands:
      - npm run build
      - cp index.html dist/

artifacts:
  files:
    - '**/*'
  base-directory: dist